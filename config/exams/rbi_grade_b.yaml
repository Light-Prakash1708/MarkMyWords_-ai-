    official_reference_url: https://opportunities.rbi.org.in
    verified_on: 2026-10-16
    verification_status: secondary
    question_types:
      - { code: RBI_DESC_10M, marks: 10, word_limit: null, time_budget_min: 18, word_tolerance_pct: 15 }
      - { code: RBI_DESC_15M, marks: 15, word_limit: null, time_budget_min: 27, word_tolerance_pct: 15 }
    syllabus:
      - { code: RBI_FM.FINANCE, title: "Financial system, markets, regulation", micro_topics: [banking, markets, risk management] }
      - { code: RBI_FM.MANAGEMENT, title: "Management — fundamentals, HR, leadership, communication", micro_topics: [motivation, leadership, ethics] }
