    name: Paper I — Economic and Social Issues (descriptive part)
    subtitle: Descriptive section of Paper I
    total_marks: 50
    duration_min: 90
    default_input_mode: typed
    fact_source_url: https://c4scourses.in/blog/rbi-grade-b-2025-syllabus-exam-pattern-2/
    official_reference_url: https://opportunities.rbi.org.in
    verified_on: 2026-10-16
    verification_status: secondary
    question_types:
      - { code: RBI_DESC_10M, marks: 10, word_limit: null, time_budget_min: 18, word_tolerance_pct: 15 }
      - { code: RBI_DESC_15M, marks: 15, word_limit: null, time_budget_min: 27, word_tolerance_pct: 15 }
    syllabus:
      - { code: RBI_ESI.GROWTH, title: "Growth and development; economic reforms", micro_topics: [growth, inflation, monetary policy] }
      - { code: RBI_ESI.SOCIAL, title: "Social structure, demographics, social justice", micro_topics: [demography, inclusion] }
    status: inactive
  - code: RBI_FM
    name: Paper III — Finance and Management (descriptive part)
    subtitle: Descriptive section of Paper III
    total_marks: 50
    duration_min: 90
    default_input_mode: typed
