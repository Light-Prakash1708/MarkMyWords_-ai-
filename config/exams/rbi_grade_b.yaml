# MarkMyWords exam configuration — RBI Grade B (DR) General, Phase II
# INACTIVE until an RBI rubric is calibrated and an RBI gold set exists.
# Facts below come from a secondary source while the 2025 notification was awaited — verify against
# the current RBI notification (https://opportunities.rbi.org.in) before activating.
exam:
  code: RBI_GRADE_B
  name: RBI Grade B (DR) General — Phase II
  short_name: RBI Grade B
  status: inactive
  config_version: 0.1.0
  input_modes: [typed]
  default_input_mode: typed
  ux:
    show_handwriting_upload: false
    show_presentation_feedback: false
    show_typing_speed: true
    editor_style: exam_terminal
papers:
